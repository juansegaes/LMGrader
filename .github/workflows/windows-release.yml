name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.9"
      - name: Install LMGrader and PyInstaller
        run: python -m pip install -e . pyinstaller
      - name: Build Windows application
        run: >-
          python -m PyInstaller --clean --noconfirm --windowed --onedir
          --name LMGrader --paths src
          --collect-all lmgrader --collect-all torch --collect-all transformers
          --hidden-import pytwain --icon src\lmgrader\ui\assets\lmgrader-icon.ico
          src\lmgrader\__main__.py
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $asset = "LMGrader-$version-windows-x64.zip"
          $env:ASSET_NAME = $asset
          @'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(r"dist\LMGrader")
          target = Path("dist") / os.environ["ASSET_NAME"]
          with ZipFile(target, "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for file in root.rglob("*"):
                  if file.is_file():
                      archive.write(file, file.relative_to(root.parent).as_posix())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "asset=$asset" >> $env:GITHUB_OUTPUT
        id: package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.package.outputs.asset }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$env:VERSION" "dist\$env:ASSET_NAME" --verify-tag --title "LMGrader $($env:VERSION.TrimStart('v'))" --generate-notes
